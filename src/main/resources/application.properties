# ============================================================
# ResortsLite - Cloud-Native Configuration (Azure)
# ============================================================
spring.application.name=ResortsLite

# Server port — sourced from environment variable for dynamic assignment
# Blocker-12: Hard-coded port replaced with environment variable
server.port=${SERVER_PORT:8080}

# ============================================================
# Database (H2 in-memory for local dev; override via env vars)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Azure Key Vault — Blocker-8,9: Replaces hard-coded DB credentials
# Set AZURE_KEY_VAULT_URI to your Key Vault endpoint, e.g.:
#   https://<vault-name>.vault.azure.net/
# ============================================================
AZURE_KEY_VAULT_URI=${AZURE_KEY_VAULT_URI:}

# ============================================================
# Azure Blob Storage — Blocker-1,2,3,4,5,6,7: Replaces local file paths
# Set AZURE_STORAGE_CONNECTION_STRING to your storage account connection string
# ============================================================
AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:}
AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}

# ============================================================
# Azure App Configuration — Blocker-10,11: Replaces hard-coded URLs
# ============================================================
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ============================================================
# Azure Cache for Redis — Blocker-13,14,15,16,17,20: Replaces HttpSession + in-memory cache
# Set SPRING_REDIS_HOST and SPRING_REDIS_PASSWORD for Azure Cache for Redis
# ============================================================
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:false}

# Spring Session backed by Redis
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# Booking cache TTL in minutes
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:60}

# ============================================================
# Azure Service Bus — Blocker-19: Replaces java.util.Timer
# Set AZURE_SERVICE_BUS_CONNECTION_STRING and AZURE_SERVICE_BUS_QUEUE_NAME
# ============================================================
AZURE_SERVICE_BUS_CONNECTION_STRING=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
AZURE_SERVICE_BUS_QUEUE_NAME=${AZURE_SERVICE_BUS_QUEUE_NAME:report-scheduler-queue}

# ============================================================
# Azure Active Directory (Entra ID) — Blocker-18: Replaces file-based authentication
# Set AZURE_ACTIVEDIRECTORY_TENANT_ID and AZURE_ACTIVEDIRECTORY_CLIENT_ID
# ============================================================
azure.activedirectory.tenant-id=${AZURE_ACTIVEDIRECTORY_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_ACTIVEDIRECTORY_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_ACTIVEDIRECTORY_CLIENT_SECRET:}
