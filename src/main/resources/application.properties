# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Replaced hard-coded port 8080 with SERVER_PORT environment variable injection.
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment properties inject
# SERVER_PORT at runtime, enabling dynamic port assignment by container orchestration platforms.
# The port value can also be managed centrally in AWS Systems Manager Parameter Store under
# /resortslite/server/port and injected via the ECS/EKS environment configuration.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# Amazon S3 configuration — cr-java-0061 remediation (Hard-coded File Paths)
# Hard-coded absolute paths (/var/legacy/reports/, C:\ResortBackups\nightly\)
# have been replaced with S3 object storage.  Override these values via
# environment variables (AWS_REPORTS_BUCKET, AWS_REPORTS_PREFIX) or AWS
# Parameter Store / Secrets Manager in production deployments.
# -----------------------------------------------------------------------
aws.s3.reports.bucket=${AWS_REPORTS_BUCKET:resorts-lite-reports}
aws.s3.reports.prefix=${AWS_REPORTS_PREFIX:reports/}
# AWS region — used by the S3Client bean (S3ClientConfig)
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# AWS Secrets Manager — cr-java-0069 remediation (Hard-coded DB Credentials)
# Hard-coded DB_USER ("admin") and DB_PASS ("Resort$Pass#2019!") have been
# removed from BookingService.java.  Credentials are now fetched at startup
# from the secret identified by aws.secretsmanager.db.secretName.
# Override via environment variable AWS_DB_SECRET_NAME in production.
# The secret must be a JSON object with keys: username, password, host,
# port, dbname  (standard format used by AWS RDS-managed secrets).
# -----------------------------------------------------------------------
aws.secretsmanager.db.secretName=${AWS_DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store — cr-java-0071 remediation (Hard-coded Environment URLs)
# Hard-coded environment-specific URLs have been removed from BookingController.java
# (inventory service URL) and ReportService.java (report download base URL).
# These URLs are now retrieved at runtime from AWS SSM Parameter Store using the
# parameter names configured below.  Override via environment variables or set the
# actual parameter values in SSM per deployment environment (dev / staging / prod).
# -----------------------------------------------------------------------

# SSM parameter name for the inventory service URL (BookingController.java, line 66 fix)
# SSM parameter value example: https://inventory-service.internal:8081/rooms/available
ssm.parameter.inventory.url=${SSM_PARAM_INVENTORY_URL:/resortslite/inventory/service-url}
# Fallback used when SSM is unreachable (local development only)
app.inventory.url.default=${APP_INVENTORY_URL_DEFAULT:https://inventory-service.internal:8081/rooms/available}

# SSM parameter name for the report download base URL (ReportService.java, line 66 fix)
# SSM parameter value example: https://reports.resorts-internal.com/download/
ssm.parameter.report.download-base-url=${SSM_PARAM_REPORT_DOWNLOAD_URL:/resortslite/reports/download-base-url}
# Fallback used when SSM is unreachable (local development only)
app.report.download.url.default=${APP_REPORT_DOWNLOAD_URL_DEFAULT:https://reports.resorts-internal.com/download/}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store — cr-java-0077 remediation (Hard-coded Ports)
# The server port is externalised to AWS SSM Parameter Store and injected at
# runtime via the SERVER_PORT environment variable in ECS/EKS/Beanstalk.
# -----------------------------------------------------------------------
# SSM parameter name for the server port (ReportService.java, line 28 fix)
ssm.parameter.server.port=${SSM_PARAM_SERVER_PORT:/resortslite/server/port}

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — cr-java-0065 remediation (HTTP Session State Storage)
# Spring Session (spring-session-data-redis) replaces the default in-memory HttpSession
# store with a centralised Redis-backed store.  All session attributes are serialised to
# ElastiCache, making every application instance fully stateless — no sticky sessions
# required on the AWS ALB, and sessions survive EC2 instance termination / scale-in.
#
# In production, set REDIS_HOST to the ElastiCache primary endpoint DNS name and
# REDIS_PORT to 6379 (or the configured port) via ECS task definition environment
# variables, EKS ConfigMap, or Elastic Beanstalk environment properties.
# -----------------------------------------------------------------------
# ElastiCache primary endpoint — override with REDIS_HOST env var in production
spring.redis.host=${REDIS_HOST:localhost}
# ElastiCache port — default 6379
spring.redis.port=${REDIS_PORT:6379}
# Spring Session store type — must be 'redis' to activate Spring Session Data Redis
spring.session.store-type=redis
# Session timeout — 30 minutes (1800 seconds); adjust per application requirements
spring.session.timeout=1800s
# Redis namespace for session keys — isolates ResortsLite sessions from other apps
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — cr-java-0067 remediation (In-Memory Caching Without TTL)
# The unbounded in-memory HashMap (bookingCache) in BookingController.java has been
# replaced with Amazon ElastiCache for Redis via Spring Data RedisTemplate.
# Cache entries are stored with a configurable TTL (app.booking.cache.ttl-seconds),
# ensuring automatic expiration, bounded memory usage, and consistent data across all
# EC2 instances.  The same ElastiCache cluster used for Spring Session (cr-java-0065)
# is reused here — no additional infrastructure is required.
#
# In production, override APP_BOOKING_CACHE_TTL_SECONDS via ECS task definition
# environment variables, EKS ConfigMap, or Elastic Beanstalk environment properties.
# -----------------------------------------------------------------------
# Booking cache TTL in seconds — default 3600 (1 hour).
# Redis automatically evicts entries after this interval, preventing stale data and
# unbounded memory growth in the ElastiCache cluster.
app.booking.cache.ttl-seconds=${APP_BOOKING_CACHE_TTL_SECONDS:3600}

# -----------------------------------------------------------------------
# Amazon Cognito — cr-java-0090 remediation (File-based Authentication)
# Authentication credentials and user data have been migrated from local file
# storage to Amazon Cognito User Pools (user identity management) and AWS
# Secrets Manager (credential storage).  The broken MD5-based confirmation code
# generation (BookingService.java line 108) has been replaced with secure UUID
# generation via CognitoAuthService.generateSecureConfirmationCode().
#
# In production, set the following via ECS task definition environment variables,
# EKS ConfigMap/Secrets, or Elastic Beanstalk environment properties:
#   AWS_COGNITO_USER_POOL_ID  — the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   AWS_COGNITO_CLIENT_ID     — the Cognito App Client ID
#   AWS_COGNITO_SECRET_NAME   — Secrets Manager secret name holding the app client secret
#                               (JSON key: "clientSecret")
# -----------------------------------------------------------------------
# Cognito User Pool ID — override with AWS_COGNITO_USER_POOL_ID env var in production
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
# Cognito App Client ID — override with AWS_COGNITO_CLIENT_ID env var in production
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:PLACEHOLDER_CLIENT_ID}
# Secrets Manager secret name for the Cognito app client secret
# Secret must be a JSON object with key "clientSecret"
aws.cognito.secretName=${AWS_COGNITO_SECRET_NAME:resortslite/cognito/app-client}
