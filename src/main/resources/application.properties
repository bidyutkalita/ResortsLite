# ============================================================
# ResortsLite — Cloud-Native Application Configuration
# All environment-specific values are injected via environment
# variables or AWS SSM Parameter Store at runtime.
# ============================================================

spring.application.name=ResortsLite

# ------------------------------------------------------------
# Server port — injected from environment variable SERVER_PORT
# cr-java-0077 FIX: no hard-coded port in application logic
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# Datasource — credentials retrieved from AWS Secrets Manager
# cr-java-0069 FIX: no hard-coded username/password
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# AWS Secrets Manager — database credential secret name
# cr-java-0069 / cr-java-0090 FIX
# ------------------------------------------------------------
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# ------------------------------------------------------------
# AWS region
# ------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}

# ------------------------------------------------------------
# Amazon S3 — report storage
# cr-java-0061 / cr-java-0062 / cr-java-0063 FIX:
# replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\
# ------------------------------------------------------------
app.report.s3-bucket=${REPORT_S3_BUCKET:resortslite-reports}
app.report.s3-prefix=${REPORT_S3_PREFIX:reports/}
app.report.presign-ttl-minutes=${REPORT_PRESIGN_TTL:60}

# ------------------------------------------------------------
# Internal service endpoints — injected from environment /
# AWS SSM Parameter Store at runtime.
# cr-java-0071 FIX: no hard-coded environment-specific URLs
# ------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# ------------------------------------------------------------
# Amazon ElastiCache for Redis — distributed session & cache
# cr-java-0065 FIX: replaces HttpSession (server-local)
# cr-java-0067 FIX: replaces in-memory HashMap cache (no TTL)
# ------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Spring Session backed by Redis
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Booking cache TTL (minutes)
app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL:60}
