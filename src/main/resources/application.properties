# =============================================================================
# ResortsLite — Cloud-Native Application Configuration (AWS)
# =============================================================================
# All environment-specific values are injected via environment variables set
# by the ECS task definition, Elastic Beanstalk environment, or SSM Parameter
# Store integration. No hard-coded credentials, hostnames, or ports remain.
# =============================================================================

spring.application.name=ResortsLite

# -----------------------------------------------------------------------------
# Server port — resolved from environment variable SERVER_PORT at runtime.
# ECS / EKS / Elastic Beanstalk inject this dynamically; default 8080 for local.
# Replaces the former hard-coded server.port=8080 (cr-java-0077 / czr-port-001).
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# DataSource — connection details injected from environment variables.
# In production, DB_URL / DB_USERNAME / DB_PASSWORD are populated by the ECS
# task definition after retrieving values from AWS Secrets Manager.
# Replaces hard-coded spring.datasource.* values (cr-java-0069).
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# AWS Secrets Manager — secret name for database credentials (cr-java-0069).
# The application retrieves the full credential bundle from this secret at
# startup via BookingService.getDbCredentials().
# -----------------------------------------------------------------------------
cloud.secrets.db-secret-name=${DB_SECRET_NAME:resortsLite/db/credentials}

# -----------------------------------------------------------------------------
# Amazon S3 — report storage (cr-java-0061, cr-java-0062, cr-java-0063).
# Replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\ paths.
# -----------------------------------------------------------------------------
cloud.s3.report-bucket=${REPORT_S3_BUCKET:resortsLite-reports}
cloud.s3.report-key-prefix=${REPORT_S3_KEY_PREFIX:reports/}

# -----------------------------------------------------------------------------
# AWS Systems Manager Parameter Store — SSM parameter names used to resolve
# environment-specific URLs and configuration (cr-java-0071, cr-java-0077).
# -----------------------------------------------------------------------------
cloud.ssm.report-download-url-param=/resortsLite/reportDownloadBaseUrl

# Report download base URL — injected from environment variable or SSM (cr-java-0071).
cloud.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:}

# -----------------------------------------------------------------------------
# Internal service endpoints — injected from environment variables backed by
# AWS Systems Manager Parameter Store (cr-java-0071 / cr-java-0088).
# Replaces hard-coded http://payment-svc.internal:9090/charge etc.
# -----------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# -----------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session + distributed cache (cr-java-0065, cr-java-0067).
# Redis host/port injected from environment variables set by ECS task definition.
# Replaces in-memory HTTP session storage and unbounded HashMap cache.
# -----------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session — use Redis as the session store (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortsLite:session

# Booking cache TTL in minutes (cr-java-0067)
cloud.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
