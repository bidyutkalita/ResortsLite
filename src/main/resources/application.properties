# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Replaced hard-coded server.port=8080 with an environment variable reference.
# The SERVER_PORT environment variable is injected at runtime by ECS task definition,
# EKS pod spec, or Elastic Beanstalk environment properties. The value is sourced from
# AWS Systems Manager Parameter Store key: /resortslite/<env>/server-port
# This enables dynamic port assignment required by container orchestration platforms
# and cloud service discovery mechanisms.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration for cloud object storage (replaces hard-coded file paths)
# Set these via environment variables or AWS Parameter Store in cloud deployments
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resortslite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}
aws.s3.backup.prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# cr-java-0069 FIX: AWS Secrets Manager configuration for database credentials.
# DB_SECRET_NAME must be set to the name or ARN of the secret in AWS Secrets Manager.
# The secret must be a JSON object: {"username": "<user>", "password": "<pass>"}
# Never hard-code credentials here — always supply via environment variable.
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: Externalized environment-specific service URLs sourced from
# AWS Systems Manager Parameter Store. In AWS deployments, set the corresponding
# SSM Parameter Store values and inject them as environment variables via the ECS
# task definition (or Spring Cloud AWS SSM bootstrap configuration).
# These replace the previously hard-coded URLs in BookingController and ReportService.
#
# SSM Parameter Store key examples:
#   /resortslite/prod/inventory-service-url  -> https://inventory-service.internal/rooms/available
#   /resortslite/prod/report-download-base-url -> https://reports.resorts-internal.com/download/
#
# Inject via ECS task definition environment variables:
#   INVENTORY_SERVICE_URL   -> value from SSM /resortslite/<env>/inventory-service-url
#   REPORT_DOWNLOAD_BASE_URL -> value from SSM /resortslite/<env>/report-download-base-url
app.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session / Spring Data Redis config.
# Replace HTTP session storage (server-affinity, single-instance) with a centralized Redis
# cluster so all Auto Scaling Group instances share the same session state.
#
# In AWS deployments set these via ECS task-definition environment variables or
# AWS Systems Manager Parameter Store:
#   REDIS_HOST  -> ElastiCache primary endpoint  (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  -> ElastiCache port              (default 6379)
#   REDIS_SSL   -> true for in-transit encryption (recommended for production)
#
# Spring Session will automatically intercept HttpSession calls and delegate to Redis.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.redis.flush-mode=on-save

# Session idle timeout — must match app.session.ttl.seconds used in BookingController.
server.servlet.session.timeout=1800s
app.session.ttl.seconds=${SESSION_TTL_SECONDS:1800}

# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Replaces the former unbounded static HashMap (bookingCache) in BookingController with
# a Redis-backed cache entry that automatically expires after this many seconds.
# This prevents indefinite memory growth, eliminates stale data across instances, and
# ensures all Auto Scaling Group nodes share a consistent, centralized cache.
#
# In AWS deployments set BOOKING_CACHE_TTL_SECONDS via:
#   - ECS task definition environment variables
#   - AWS Systems Manager Parameter Store (injected at startup)
#   - Elastic Beanstalk environment properties
app.booking.cache.ttl.seconds=${BOOKING_CACHE_TTL_SECONDS:3600}

# cr-java-0090 FIX: Amazon Cognito User Pool configuration for cloud-native guest
# identity management. Replaces file-based authentication / local user credential
# storage with Amazon Cognito User Pool identity validation.
#
# In AWS deployments set COGNITO_USER_POOL_ID via:
#   - ECS task definition environment variables
#   - AWS Systems Manager Parameter Store (injected at startup)
#   - Elastic Beanstalk environment properties
#
# SSM Parameter Store key example:
#   /resortslite/<env>/cognito-user-pool-id  -> us-east-1_AbCdEfGhI
#
cognito.user.pool.id=${COGNITO_USER_POOL_ID:}
