# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized per 12-factor app principles.
spring.application.name=ResortsLite

# Server port is injected via environment variable (SERVER_PORT).
# Fixes cr-java-0077: Hard-coded Ports — no fixed port in source code.
# ECS/EKS/Elastic Beanstalk injects SERVER_PORT at runtime for dynamic port binding.
server.port=${SERVER_PORT:8080}

# Database connection — credentials are retrieved from AWS Secrets Manager at runtime.
# DB_HOST, DB_USER, DB_PASS are injected via environment variables (not hard-coded).
# Fixes cr-java-0069: Hard-coded Database Credentials.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Session — use Redis (Amazon ElastiCache) for distributed session storage.
# Fixes cr-java-0065: HTTP Session State Storage — sessions are now stored in Redis,
# enabling stateless application instances and horizontal scaling.
spring.session.store-type=redis
spring.session.timeout=30m

# Redis / Amazon ElastiCache connection — host and port injected via environment variables.
# REDIS_HOST and REDIS_PORT are set by ECS task definition or Elastic Beanstalk env config.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Service endpoints — injected via environment variables or resolved from SSM Parameter Store.
# Fixes cr-java-0071: Hard-coded Environment URLs.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# Amazon S3 — bucket name for report storage (replaces local file system paths).
# Fixes cr-java-0061, cr-java-0062, cr-java-0063: Hard-coded File Paths / Local File Writes.
app.report.s3.bucket=${REPORT_S3_BUCKET:resortlite-reports}

# AWS region — required by AWS SDK v2 clients (S3, Secrets Manager, SSM).
aws.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager — secret names for credentials (not values).
app.secrets.db-credentials=${DB_CREDENTIALS_SECRET_NAME:resortlite/db/credentials}
app.secrets.auth-credentials=${AUTH_CREDENTIALS_SECRET_NAME:resortlite/auth/credentials}

# AWS SSM Parameter Store — parameter paths for environment-specific URLs.
app.ssm.inventory-url-param=${INVENTORY_URL_SSM_PARAM:/resortlite/inventory/service-url}
app.ssm.report-download-url-param=${REPORT_DOWNLOAD_URL_SSM_PARAM:/resortlite/report/download-base-url}
