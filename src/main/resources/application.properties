# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — read from environment variable PORT; defaults to 8080 for local development.
# Container orchestration (ECS/EKS) injects PORT dynamically; avoids hardcoded port (czr-port-001).
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# PostgreSQL 16 DataSource Configuration
# Connection parameters are externalised to environment variables so that
# credentials are never stored in source code or version control (cr-java-0021, sec-cred-001).
#
# Required environment variables:
#   DB_HOST     — PostgreSQL hostname or RDS endpoint  (default: localhost)
#   DB_PORT     — PostgreSQL port                      (default: 5432)
#   DB_NAME     — Database / schema name               (default: resortdb)
#   DB_USER     — Database username                    (default: postgres)
#   DB_PASSWORD — Database password                    (no default; must be set)
#
# For AWS deployments inject these via:
#   - ECS Task Definition environment / secrets (Secrets Manager ARN)
#   - EKS ConfigMap + ExternalSecret (AWS Secrets Manager / Parameter Store)
# -----------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection-pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL dialect — Spring Boot auto-detects, but explicit setting avoids ambiguity
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema initialisation: 'always' recreates on startup; use 'never' in production
spring.sql.init.mode=always

# -----------------------------------------------------------------------
# External service endpoints — externalised to environment variables.
# Hardcoded internal hostnames are non-routable in cloud VPC environments
# without manual DNS configuration (cr-java-0021, cr-java-0088).
#
# Required environment variables:
#   PAYMENT_ENDPOINT      — Payment service base URL
#   INVENTORY_ENDPOINT    — Inventory / rooms service base URL
#   NOTIFICATION_ENDPOINT — Notification service base URL
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# -----------------------------------------------------------------------
# Report storage — externalised to environment variable so the path works
# inside Docker containers and cloud environments (czr-java-001).
#
# Required environment variable:
#   REPORT_BASE_PATH — Absolute path to report output directory
#                      (e.g. /tmp/reports or an EFS/S3-mounted path)
# -----------------------------------------------------------------------
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
