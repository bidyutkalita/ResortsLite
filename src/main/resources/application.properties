# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized per 12-factor app principles.
# Sensitive values (credentials, secrets) are stored in AWS Secrets Manager.
# Infrastructure endpoints and ports are stored in AWS SSM Parameter Store.

spring.application.name=ResortsLite

# Server port: read from environment variable injected by ECS/EKS/Elastic Beanstalk
# (cr-java-0077 — replaces hard-coded port 8080)
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Credentials are retrieved at runtime from AWS Secrets Manager by BookingService.
# The datasource URL uses the H2 in-memory database for local/test environments;
# production deployments override these via environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# Secret name for database credentials (cr-java-0069)
aws.secrets.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# ─── AWS SSM Parameter Store ─────────────────────────────────────────────────
# Parameter paths for externalized URLs (cr-java-0071)
aws.ssm.report-download-url-param=/resortslite/report/download-base-url
aws.ssm.inventory-url-param=/resortslite/inventory/endpoint

# ─── Amazon S3 ───────────────────────────────────────────────────────────────
# S3 bucket for report storage (cr-java-0061, cr-java-0062, cr-java-0063)
REPORT_S3_BUCKET=${REPORT_S3_BUCKET:resorts-reports-bucket}

# ─── Service Endpoints (resolved from SSM Parameter Store at runtime) ─────────
# These properties serve as fallback defaults; production values come from SSM.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal:7070/send}

# ─── Spring Session — Amazon ElastiCache for Redis ───────────────────────────
# Replaces in-process HTTP session storage (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Redis connection — points to ElastiCache cluster endpoint injected at deploy time
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# ─── AWS Region ──────────────────────────────────────────────────────────────
aws.region=${AWS_REGION:us-east-1}
