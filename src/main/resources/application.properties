# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables
# backed by AWS Systems Manager Parameter Store and AWS Secrets Manager.

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — resolved from environment variable (ECS task / Beanstalk).
# Blocker-12 (cr-java-0077): No longer hard-coded; defaults to 8080 if unset.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# DataSource — credentials retrieved from AWS Secrets Manager at startup.
# Blocker-8/9 (cr-java-0069): DB_USER / DB_PASS removed from source code.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# AWS Secrets Manager — DB credentials secret name
# Blocker-8/9 (cr-java-0069)
# -----------------------------------------------------------------------
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# Amazon S3 — report storage bucket
# Blocker-1/2/3/4/5/6/7 (cr-java-0061/0062/0063): replaces /var/legacy/reports/
# -----------------------------------------------------------------------
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Spring Session backed by Amazon ElastiCache for Redis
# Blocker-13/14/15/16/17 (cr-java-0065): HTTP session stored in Redis
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------
# Internal service endpoints — resolved from environment variables
# backed by AWS Systems Manager Parameter Store.
# Blocker-10/11 (cr-java-0071): No longer hard-coded in source code.
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# -----------------------------------------------------------------------
# SSM Parameter Store — parameter name for report base URL
# Blocker-11 (cr-java-0071)
# -----------------------------------------------------------------------
REPORT_BASE_URL_PARAM=${REPORT_BASE_URL_PARAM:/resortslite/report/base-url}
